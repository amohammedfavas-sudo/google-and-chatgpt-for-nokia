
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apps</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .app {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 17px 22px;
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .app:hover {
      background: #1c1c1c;
      transform: scale(1.03);
      border-color: #444;
    }

    .app img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="app" href="https://www.google.com/" target="_blank">
      <img src="https://www.google.com/s2/favicons?domain=google.com&sz=64">
      Google
    </a>

    <a class="app" href="https://chatgpt.com/" target="_blank">
      <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64">
      ChatGPT
    </a>

    <a class="app" href="https://mail.google.com/mail/u/0/" target="_blank">
      <img src="https://www.google.com/s2/favicons?domain=gmail.com&sz=64">
      Gmail
    </a>
     <a class="app" href="https://www.instagram.com/" target="_blank">
      <img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=64">
      Instagram
    </a>

  </div>

</body>
</html>
